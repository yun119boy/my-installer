<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Installer Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 360px;
            padding: 30px;
            background: #1f2937;
            border-radius: 12px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .login-box h1 {
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            color: #d1d5db;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

        #dashboard {
            display: none;
        }

        header {
            padding: 20px 30px;
            background: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        #logoutButton {
            width: auto;
            margin: 0;
            padding: 10px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #1f2937;
            padding: 25px;
            border-radius: 12px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 18px;
            color: #9ca3af;
        }

        .number {
            font-size: 40px;
            font-weight: bold;
        }

        .section {
            margin-top: 30px;
            background: #1f2937;
            padding: 25px;
            border-radius: 12px;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login-box">

    <h1>Admin Login</h1>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

    <header>

        <h1>My Installer Admin</h1>

        <button id="logoutButton">
            Logout
        </button>

    </header>


    <div class="container">

        <div class="cards">

            <div class="card">

                <h2>📁 Files</h2>

                <div
                    class="number"
                    id="fileCount"
                >
                    0
                </div>

            </div>


            <div class="card">

                <h2>🔑 Keys</h2>

                <div
                    class="number"
                    id="keyCount"
                >
                    0
                </div>

            </div>


            <div class="card">

                <h2>📊 Usage</h2>

                <div
                    class="number"
                    id="usageCount"
                >
                    0
                </div>

            </div>

        </div>


<div class="section">

    <h2>🔑 Key Management</h2>

    <label>เลือกไฟล์</label>

    <select
        id="keyFile"
        style="
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
        "
    >
        <option value="">กำลังโหลดไฟล์...</option>
    </select>

    <button onclick="generateKey()">
        Generate Key
    </button>

    <div
        id="generatedKey"
        style="
            margin-top: 20px;
            padding: 15px;
            background: #374151;
            border-radius: 8px;
            display: none;
            word-break: break-all;
        "
    ></div>

</div>


   <div class="section">

    <h2>File Management</h2>

    <input
        type="text"
        id="fileName"
        placeholder="ชื่อไฟล์ เช่น st.exe"
    >

    <input
        type="text"
        id="fileUrl"
        placeholder="URL ของไฟล์"
        style="margin-top: 10px;"
    >

    <button onclick="addFile()">
        เพิ่มไฟล์
    </button>

    <div id="fileList" style="margin-top: 20px;">
        กำลังโหลด...
    </div>

</div>
    </div>

</div>


<script>

const SUPABASE_URL =
    "https://utvmdjprzzteltajqwzk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_mjYpjIrSO72sJ31rVNtaEw_ggT889Mz";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const loginPage =
    document.getElementById("loginPage");

const dashboard =
    document.getElementById("dashboard");

const loginForm =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");

const logoutButton =
    document.getElementById("logoutButton");


// ตรวจสอบว่ามี Login อยู่แล้วหรือไม่

async function checkSession() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (session) {

        showDashboard();

    }

}


// แสดง Dashboard

function showDashboard() {

    loginPage.style.display = "none";

    dashboard.style.display = "block";

    loadFiles();
    loadKeyFiles();

}

// Login

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const email =
            document.getElementById(
                "email"
            ).value;


        const password =
            document.getElementById(
                "password"
            ).value;


        message.style.color =
            "#ffffff";

        message.textContent =
            "กำลังเข้าสู่ระบบ...";


        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


        if (error) {

            message.style.color =
                "#f87171";

            message.textContent =
                "เข้าสู่ระบบไม่สำเร็จ: "
                + error.message;

            return;

        }


        message.style.color =
            "#4ade80";

        message.textContent =
            "เข้าสู่ระบบสำเร็จ!";


        showDashboard();

    }
);


// Logout

logoutButton.addEventListener(
    "click",
    async () => {

        await supabaseClient.auth.signOut();

        dashboard.style.display =
            "none";

        loginPage.style.display =
            "block";

        message.textContent = "";

    }
);


// เริ่มตรวจ Session

checkSession();

async function addFile() {

    const name =
        document.getElementById("fileName").value.trim();

    const url =
        document.getElementById("fileUrl").value.trim();

    if (!name || !url) {

        alert("กรุณาใส่ชื่อไฟล์และ URL");

        return;
    }

    const { error } =
        await supabaseClient
            .from("files")
            .insert({
                name: name,
                storage_url: url
            });

    if (error) {

        alert(
            "เพิ่มไฟล์ไม่สำเร็จ: "
            + error.message
        );

        console.error(error);

        return;
    }

    alert("เพิ่มไฟล์สำเร็จ!");

    document.getElementById("fileName").value = "";
    document.getElementById("fileUrl").value = "";

    loadFiles();
}


async function loadFiles() {

    const { data, error } =
        await supabaseClient
            .from("files")
            .select("*")
            .order("created_at", {
                ascending: false
            });

    const fileList =
        document.getElementById("fileList");

    if (error) {

        fileList.innerHTML =
            "โหลดไฟล์ไม่สำเร็จ: "
            + error.message;

        return;
    }

    if (!data || data.length === 0) {

        fileList.innerHTML =
            "ยังไม่มีไฟล์";

        return;
    }

    fileList.innerHTML =
        data.map(file => `
            <div style="
                padding: 15px;
                margin-bottom: 10px;
                background: #374151;
                border-radius: 8px;
            ">

                <strong>${file.name}</strong>

                <br>

                <a
                    href="${file.storage_url}"
                    target="_blank"
                    style="color: #60a5fa;"
                >
                    เปิดไฟล์
                </a>

            </div>
        `).join("");
}
async function loadKeyFiles() {

    const select =
        document.getElementById("keyFile");

    const { data, error } =
        await supabaseClient
            .from("files")
            .select("id, name")
            .order("name");

    if (error) {

        console.error(error);

        select.innerHTML =
            '<option value="">โหลดไฟล์ไม่สำเร็จ</option>';

        return;
    }

    if (!data || data.length === 0) {

        select.innerHTML =
            '<option value="">ยังไม่มีไฟล์</option>';

        return;
    }

    select.innerHTML =
        '<option value="">-- เลือกไฟล์ --</option>';

    data.forEach(file => {

        const option =
            document.createElement("option");

        option.value = file.id;
        option.textContent = file.name;

        select.appendChild(option);

    });
}


function createRandomKey() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let key = "";

    for (let i = 0; i < 16; i++) {

        if (i > 0 && i % 4 === 0) {
            key += "-";
        }

        key +=
            chars[
                Math.floor(
                    Math.random() * chars.length
                )
            ];
    }

    return key;
}


async function generateKey() {

    const fileId =
        document.getElementById("keyFile").value;

    if (!fileId) {

        alert("กรุณาเลือกไฟล์ก่อน");

        return;
    }

    const keyCode =
        createRandomKey();

    const { error } =
        await supabaseClient
            .from("keys")
            .insert({
                key_code: keyCode,
                file_id: fileId,
                status: "unused"
            });

    if (error) {

        alert(
            "สร้าง Key ไม่สำเร็จ: "
            + error.message
        );

        console.error(error);

        return;
    }

    const generatedKey =
        document.getElementById("generatedKey");

    generatedKey.style.display = "block";

    generatedKey.innerHTML = `
        <strong>สร้าง Key สำเร็จ!</strong>
        <br><br>
        <span style="font-size: 20px;">
            ${keyCode}
        </span>
    `;

}
    
</script>

</body>
</html>
