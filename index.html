<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 360px;
            padding: 30px;
            background: #1f2937;
            border-radius: 12px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #d1d5db;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 0;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #f87171;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h1>Admin Login</h1>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Admin email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <div id="message"></div>
</div>

<script>
    const SUPABASE_URL =
        "https://utvmdjprzzteltajqwzk.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_mjYpjIrSO72sJ31rVNtaEw_ggT889Mz";

    const { createClient } =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        message.textContent = "กำลังเข้าสู่ระบบ...";

        const { data, error } =
            await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            message.textContent =
                "เข้าสู่ระบบไม่สำเร็จ: " + error.message;
            return;
        }

        message.style.color = "#4ade80";
        message.textContent =
            "เข้าสู่ระบบสำเร็จ!";

        console.log(data);
    });
</script>

</body>
</html>
